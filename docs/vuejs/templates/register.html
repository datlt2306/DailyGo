<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanguard Store - Đăng Ký Tài Khoản</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    h1, h2, h3, .font-heading {
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen justify-center items-center p-4">

  <!-- Main Container Card -->
  <div class="w-full max-w-md bg-white rounded-3xl border border-slate-100 shadow-xl p-8 space-y-5 my-8">
    
    <!-- Header/Logo -->
    <div class="text-center space-y-2">
      <a href="index.html" class="inline-flex items-center space-x-2 text-2xl font-bold tracking-tight text-indigo-600">
        <i data-lucide="shopping-bag" class="w-7 h-7"></i>
        <span>Vanguard<span class="text-slate-800 font-medium text-lg">Store</span></span>
      </a>
      <h2 class="text-xl font-extrabold text-slate-900 pt-3">Đăng ký tài khoản mới</h2>
      <p class="text-slate-400 text-xs">Điền đầy đủ thông tin bên dưới để bắt đầu mua sắm</p>
    </div>

    <!-- Register Form -->
    <form class="space-y-4">
      <!-- Họ và tên -->
      <div class="space-y-1.5">
        <label for="name" class="text-xs font-bold text-slate-700">Họ và Tên</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
            <i data-lucide="user" class="w-4 h-4"></i>
          </span>
          <input 
            type="text" 
            id="name" 
            placeholder="Nguyễn Văn A" 
            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 bg-slate-50/50 text-sm transition-all"
            required
          />
        </div>
      </div>

      <!-- Email -->
      <div class="space-y-1.5">
        <label for="email" class="text-xs font-bold text-slate-700">Địa chỉ Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
            <i data-lucide="mail" class="w-4 h-4"></i>
          </span>
          <input 
            type="email" 
            id="email" 
            placeholder="name@example.com" 
            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 bg-slate-50/50 text-sm transition-all"
            required
          />
        </div>
      </div>

      <!-- Mật khẩu -->
      <div class="space-y-1.5">
        <label for="password" class="text-xs font-bold text-slate-700">Mật khẩu</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••" 
            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 bg-slate-50/50 text-sm transition-all"
            required
          />
        </div>
      </div>

      <!-- Xác nhận mật khẩu -->
      <div class="space-y-1.5">
        <label for="confirm-password" class="text-xs font-bold text-slate-700">Xác nhận mật khẩu</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input 
            type="password" 
            id="confirm-password" 
            placeholder="••••••••" 
            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 bg-slate-50/50 text-sm transition-all"
            required
          />
        </div>
      </div>

      <!-- Đồng ý điều khoản -->
      <div class="flex items-center space-x-2 pt-1">
        <input type="checkbox" id="terms" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4" required />
        <label for="terms" class="text-xs text-slate-500">Tôi đồng ý với điều khoản & chính sách dịch vụ.</label>
      </div>

      <!-- Đăng ký -->
      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-600/10 hover:shadow-indigo-600/30 transition-all text-sm mt-2"
      >
        Tạo tài khoản
      </button>
    </form>

    <!-- Footer link -->
    <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
      Đã có tài khoản? 
      <a href="login.html" class="font-bold text-indigo-600 hover:text-indigo-700 transition-colors">Đăng nhập</a>
    </div>

  </div>

  <!-- Back Link -->
  <div class="text-center mb-8">
    <a href="index.html" class="inline-flex items-center space-x-1.5 text-xs font-semibold text-slate-400 hover:text-slate-600 transition-colors">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      <span>Quay lại trang chủ</span>
    </a>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanguard Store - Đăng Nhập</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    h1, h2, h3, .font-heading {
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen justify-center items-center p-4">

  <!-- Main Container Card -->
  <div class="w-full max-w-md bg-white rounded-3xl border border-slate-100 shadow-xl p-8 space-y-6">
    
    <!-- Header/Logo -->
    <div class="text-center space-y-2">
      <a href="index.html" class="inline-flex items-center space-x-2 text-2xl font-bold tracking-tight text-indigo-600">
        <i data-lucide="shopping-bag" class="w-7 h-7"></i>
        <span>Vanguard<span class="text-slate-800 font-medium text-lg">Store</span></span>
      </a>
      <h2 class="text-xl font-extrabold text-slate-900 pt-3">Chào mừng bạn quay lại</h2>
      <p class="text-slate-400 text-xs">Vui lòng đăng nhập tài khoản của bạn để tiếp tục mua sắm</p>
    </div>

    <!-- Login Form -->
    <form class="space-y-4">
      <!-- Email -->
      <div class="space-y-1.5">
        <label for="email" class="text-xs font-bold text-slate-700">Địa chỉ Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
            <i data-lucide="mail" class="w-4 h-4"></i>
          </span>
          <input 
            type="email" 
            id="email" 
            placeholder="name@example.com" 
            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 bg-slate-50/50 text-sm transition-all"
            required
          />
        </div>
      </div>

      <!-- Mật khẩu -->
      <div class="space-y-1.5">
        <div class="flex justify-between items-center">
          <label for="password" class="text-xs font-bold text-slate-700">Mật khẩu</label>
          <a href="#" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700 transition-colors">Quên mật khẩu?</a>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••" 
            class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 bg-slate-50/50 text-sm transition-all"
            required
          />
          <button type="button" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
            <i data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Đăng nhập -->
      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-600/10 hover:shadow-indigo-600/30 transition-all text-sm mt-2"
      >
        Đăng Nhập
      </button>
    </form>

    <!-- Footer link -->
    <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
      Chưa có tài khoản? 
      <a href="register.html" class="font-bold text-indigo-600 hover:text-indigo-700 transition-colors">Đăng ký ngay</a>
    </div>

  </div>

  <!-- Back Link -->
  <div class="mt-6 text-center">
    <a href="index.html" class="inline-flex items-center space-x-1.5 text-xs font-semibold text-slate-400 hover:text-slate-600 transition-colors">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      <span>Quay lại trang chủ</span>
    </a>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
